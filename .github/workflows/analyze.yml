name: Flutter analyze

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          cat analyze.txt
          # "  error • message • lib/file.dart:10:5 • code"  ->  annotation lines
          grep -E '^\s*(error|warning) • ' analyze.txt \
            | sed -E 's/^\s*(error|warning) • (.*) • ([^ ]+):([0-9]+):([0-9]+) • ([a-z_]+)\s*$/\1|\3|\4|\5|\2 (\6)/' \
            > issues.txt
          grep -c '^error|' issues.txt > errors.count || true
          grep -c '^warning|' issues.txt > warnings.count || true
          true

      - name: Summary
        run: echo "::notice title=Analyzer::errors=$(cat errors.count) warnings=$(cat warnings.count)"

      # GitHub shows at most 10 error annotations per step, so report in slices.
      - name: Issues 1-10
        run: sed -n '1,10p' issues.txt | while IFS='|' read -r lvl file line col msg; do echo "::$lvl file=$file,line=$line,col=$col::$msg"; done
      - name: Issues 11-20
        run: sed -n '11,20p' issues.txt | while IFS='|' read -r lvl file line col msg; do echo "::$lvl file=$file,line=$line,col=$col::$msg"; done
      - name: Issues 21-30
        run: sed -n '21,30p' issues.txt | while IFS='|' read -r lvl file line col msg; do echo "::$lvl file=$file,line=$line,col=$col::$msg"; done
      - name: Issues 31-40
        run: sed -n '31,40p' issues.txt | while IFS='|' read -r lvl file line col msg; do echo "::$lvl file=$file,line=$line,col=$col::$msg"; done

      - name: Fail on errors
        run: test "$(cat errors.count)" = "0"

  # Widget tests for the design system + screenshots for review.
  widgets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Widget tests and screenshots
        run: |
          set +e
          flutter test test/ui test/widget_test.dart --update-goldens -r json > ui.jsonl
          code=$?
          python3 - <<'PY'
          import json
          names, n = {}, 0
          for line in open('ui.jsonl'):
              try:
                  e = json.loads(line)
              except Exception:
                  continue
              if e.get('type') == 'testStart':
                  names[e['test']['id']] = e['test']['name']
              if e.get('type') == 'error' and n < 30:
                  n += 1
                  msg = (e.get('error', '') + '\n' + e.get('stackTrace', ''))[:1500]
                  msg = msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::error title={names.get(e['testID'], 'test')[:100]}::{msg}")
          PY
          exit $code
      # Also published to the ui-screenshots branch (one folder per branch)
      # so they can be viewed from anywhere with git.
      - name: Publish screenshots
        if: always() && github.event_name == 'push'
        run: |
          [ -d test/ui/screenshots ] || exit 0
          dest="$RUNNER_TEMP/shots"
          git clone --quiet --depth 1 --branch ui-screenshots \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$dest" \
            || (mkdir -p "$dest" && cd "$dest" && git init -q -b ui-screenshots \
                && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}")
          rm -rf "$dest/${{ github.ref_name }}"
          mkdir -p "$dest/${{ github.ref_name }}"
          cp test/ui/screenshots/*.png "$dest/${{ github.ref_name }}/"
          cd "$dest"
          git config user.name "ci-screenshots"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${{ github.ref_name }} @ ${GITHUB_SHA::7}" || exit 0
          git push -q origin HEAD:ui-screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: test/ui/screenshots/
          if-no-files-found: ignore

  # Runs the app's API client against the real backend + MongoDB.
  contract:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: development
      PORT: 4000
      MONGO_URI: mongodb://localhost:27017/dalabapay_contract
      JWT_SECRET: contract-test-secret-contract-test-secret
      BILL_PROVIDER: simulator
      PAYMENT_PROVIDER: simulator
      WEBHOOK_SECRET: contract-webhook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ALNATU2025/newproject-backend
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start backend
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          nohup node src/server.js > ../server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/health && break; sleep 1; done
          curl -sf http://localhost:4000/health
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Contract test
        env:
          BACKEND_DIR: ${{ github.workspace }}/backend
        run: |
          set +e
          flutter test test/api_contract_test.dart --dart-define=API_URL=http://localhost:4000 -r json > results.jsonl
          code=$?
          python3 - <<'PY'
          import json
          names, n = {}, 0
          for line in open('results.jsonl'):
              try:
                  e = json.loads(line)
              except Exception:
                  continue
              if e.get('type') == 'testStart':
                  names[e['test']['id']] = e['test']['name']
              if e.get('type') == 'error' and n < 30:
                  n += 1
                  msg = (e.get('error', '') + '\n' + e.get('stackTrace', ''))[:1500]
                  msg = msg.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
                  print(f"::error title={names.get(e['testID'], 'test')[:100]}::{msg}")
          PY
          exit $code
      - name: Backend log (on failure)
        if: failure()
        run: |
          tail -n 60 server.log
          grep -iE "error|exception" server.log | tail -n 10 | while read -r l; do echo "::warning title=server::$l"; done
