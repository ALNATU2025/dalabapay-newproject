<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalabapay · Pay bills, add money and send money</title>
  <meta name="description" content="Dalabapay: buy airtime and data, pay electricity and TV bills, add money and send money in Nigeria and Sierra Leone. Use the website or the app with the same account.">
  <meta name="theme-color" content="#15368A">
  <meta property="og:title" content="Dalabapay">
  <meta property="og:description" content="Pay bills, add money and send money — on the web or in the app.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dalabapay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown while the app loads (first visit can take a few seconds). */
    html, body { margin: 0; height: 100%; background: #F5F7FB; }
    #dp-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #15368A; transition: opacity .3s ease;
    }
    #dp-loading img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 10px 30px rgba(21,54,138,.15); }
    #dp-loading .name { font-weight: 800; font-size: 22px; letter-spacing: -.3px; }
    #dp-loading .bar { width: 140px; height: 4px; border-radius: 4px; background: #E3E8F3; overflow: hidden; }
    #dp-loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #079A68;
      animation: dp-slide 1.1s ease-in-out infinite;
    }
    @keyframes dp-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #dp-loading .bar::after { animation: none; width: 100%; } }
    noscript { font-family: system-ui, sans-serif; display: block; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div id="dp-loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">Dalabapay</div>
    <div class="bar" aria-hidden="true"></div>
  </div>
  <noscript>Dalabapay needs JavaScript. Please turn it on, or download the Dalabapay app.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('dp-loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 350);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
