<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dalabapay · Pay bills, add money and send money</title>
  <meta name="description" content="Dalabapay: buy airtime and data, pay electricity and TV bills, add money and send money in Nigeria and Sierra Leone. Use the website or the app with the same account.">
  <meta name="theme-color" content="#15368A">
  <meta property="og:title" content="Dalabapay">
  <meta property="og:description" content="Pay bills, add money and send money — on the web or in the app.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dalabapay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown while the app loads; looks like the app's own splash screen. It
       sits BEHIND the app (z-index -1), so it can never cover it, and it is
       removed as soon as the app appears. */
    html, body { margin: 0; height: 100%; background: #ffffff; }
    #dp-loading {
      position: fixed; inset: 0; z-index: -1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; pointer-events: none;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .3s ease;
    }
    #dp-loading img { width: 96px; height: 96px; object-fit: contain; }
    #dp-loading .name { font-weight: 800; font-size: 40px; letter-spacing: -1px; color: #15368A; }
    #dp-loading .name span { color: #079A68; }
    #dp-loading .tag { font-size: 17px; color: #15368A; }
    #dp-loading .dots { display: flex; gap: 8px; margin-top: 18px; }
    #dp-loading .dots i { display: block; width: 10px; height: 10px; border-radius: 5px; background: #15368A; animation: dp-pulse 1.2s infinite ease-in-out; }
    #dp-loading .dots i:nth-child(2) { width: 30px; background: #079A68; animation-delay: .15s; }
    #dp-loading .dots i:nth-child(3) { background: #6FCF97; animation-delay: .3s; }
    #dp-loading .slow { display: none; margin-top: 18px; font-size: 13px; color: #5B6B8C; text-align: center; padding: 0 24px; }
    @keyframes dp-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #dp-loading .dots i { animation: none; opacity: 1; } }
    noscript { font-family: system-ui, sans-serif; display: block; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div id="dp-loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">Dalaba<span>pay</span></div>
    <div class="tag">Smart Life Fast Pay</div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="slow" id="dp-slow">Still loading… If this takes long, check your internet connection and refresh the page.</div>
  </div>
  <noscript>Dalabapay needs JavaScript. Please turn it on, or download the Dalabapay app.</noscript>
  <script>
    (function () {
      var el = document.getElementById('dp-loading');
      function done() {
        if (!el) return;
        var x = el; el = null;
        x.style.opacity = '0';
        setTimeout(function () { x.remove(); }, 350);
      }
      // The app has drawn its first screen…
      window.addEventListener('flutter-first-frame', done);
      // …or its view was added to the page (older/newer Flutter versions).
      new MutationObserver(function (_, obs) {
        if (document.querySelector('flutter-view, flt-glass-pane')) { obs.disconnect(); setTimeout(done, 1500); }
      }).observe(document.body, { childList: true, subtree: true });
      // Slow connection: say so instead of spinning silently.
      setTimeout(function () { var s = document.getElementById('dp-slow'); if (el && s) s.style.display = 'block'; }, 20000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
