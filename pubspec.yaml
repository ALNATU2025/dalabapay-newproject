name: dalabapay
description: Dalabapay — bills, wallet and commission app (talks to newproject-backend).
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Inter font used by the design system (lib/core/theme/app_theme.dart)
  google_fonts: ^6.3.0
  # Backend calls, saved login token and receipt sharing
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  # Animations for success, loading and empty states (assets/animations/)
  lottie: ^3.1.2
  # Sign-up SMS codes (Firebase Phone Auth) — see lib/core/firebase_setup.dart
  firebase_core: ^4.14.0
  firebase_auth: ^6.7.0
  # Phone push notifications — see lib/core/push.dart
  firebase_messaging: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    # Logos, onboarding art, service icons and banners go here.
    # See IMAGES_NEEDED.md. Every missing image falls back to an icon.
    - assets/images/
    - assets/images/onboarding_1.png
    - assets/images/onboarding_2.png
    - assets/images/onboarding_3.png
    - assets/images/app_barlogo.png
    - assets/animations/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/dabalogo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
